name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Format check
        run: crystal tool format --check src spec bin/claude-swarm

      - name: Build
        run: crystal build bin/claude-swarm --error-trace

      - name: Run specs
        run: crystal spec --error-trace

      - name: Demo smoke test
        run: crystal run bin/claude-swarm -- --demo --no-ui
